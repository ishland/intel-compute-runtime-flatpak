name: Build & Release

# The scheduled run watches intel/compute-runtime for new releases, builds the
# flatpak bundles for every supported freedesktop SDK branch and publishes them
# as GitHub releases. Older releases are pruned afterwards, so the newest
# bundles stay available without the release list growing forever.

on:
  push:
  pull_request:

  schedule:
    # Daily. GitHub's own cron is congested on the hour, so stay a bit off it.
    - cron: '23 4 * * *'

  workflow_dispatch:
    inputs:
      series:
        description: Which upstream series to package
        type: choice
        default: both
        options: [both, main, legacy]
      force:
        description: Rebuild versions that already have a release
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: ${{ github.ref }}-release
  cancel-in-progress: false

env:
  SDKS: '' # empty: build for the newest SDK_COUNT freedesktop branches
  SDK_COUNT: '3'
  LEGACY_PREFIX: '24.35.'
  KEEP_RELEASES: '5'

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.check.outputs.matrix }}
      has_work: ${{ steps.check.outputs.has_work }}
      main: ${{ steps.check.outputs.main }}
      legacy: ${{ steps.check.outputs.legacy }}
    steps:
      - uses: actions/checkout@v7

      - name: Look for new compute-runtime releases
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/check-releases.py \
            --sdks "$SDKS" \
            --sdk-count "$SDK_COUNT" \
            --legacy-prefix "$LEGACY_PREFIX" \
            --series "${{ inputs.series || 'both' }}" \
            ${{ inputs.force && '--force' || '' }}

  build:
    needs: detect
    if: needs.detect.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    name: ${{ matrix.series }} ${{ matrix.version }} (SDK ${{ matrix.sdk }})

    steps:
      - uses: actions/checkout@v7

      # There's no need for this, for now
      #- name: More space
      #  uses: LizardByte/actions/actions/more_space@39c468549cfb87ccb917e5e5342e18abc926dc48  # v2026.909.30231
      #  with:
      #    analyze-space-savings: true
      #    clean-all: true

      - name: Install flatpak-builder
        run: |
          sudo apt update
          sudo apt install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Generate the manifest
        id: manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/bundles
          python3 scripts/gen-manifest.py \
            --series "${{ matrix.series }}" \
            --version "${{ matrix.version }}" \
            --sdk "${{ matrix.sdk }}" \
            --out "build/bundles/${{ matrix.series }}-${{ matrix.sdk }}.yaml" \
            --report "build/bundles/release.json"

      - name: Build the extension
        run: |
          flatpak-builder --user --force-clean --install-deps-from=flathub \
            --repo=build/repo \
            "build/${{ matrix.series }}-${{ matrix.sdk }}.build" \
            "${{ steps.manifest.outputs.manifest }}"

      - name: Create the bundles
        id: bundle
        run: |
          set -euo pipefail
          id="${{ steps.manifest.outputs.id }}"
          runtime=(--runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo --runtime "${{ matrix.sdk }}")
          bundle="build/bundles/$id-${{ matrix.sdk }}.flatpak"
          debug_bundle="build/bundles/$id.Debug-${{ matrix.sdk }}.flatpak"
          flatpak build-bundle build/repo "$bundle" "$id" "${runtime[@]}"
          flatpak build-bundle build/repo "$debug_bundle" "$id.Debug" "${runtime[@]}"
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"

      - name: Check that the driver loads
        run: |
          set -euo pipefail
          flatpak install --user --noninteractive -y flathub "org.freedesktop.Platform.ClInfo//${{ matrix.sdk }}"
          flatpak install --user --noninteractive -y "${{ steps.bundle.outputs.bundle }}"
          FLATPAK_GL_DRIVERS="${{ steps.manifest.outputs.gl_name }}:default" \
            flatpak run --env=LD_DEBUG=libs \
              "org.freedesktop.Platform.ClInfo//${{ matrix.sdk }}" 2>&1 | tee clinfo.log
          grep -E "calling init: .*/${{ steps.manifest.outputs.icd_library }}" clinfo.log

      - name: Check the extension contents
        env:
          FLATPAK_GL_DRIVERS: ${{ steps.manifest.outputs.gl_name }}:default
        run: |
          flatpak run --command=sh "org.freedesktop.Platform.ClInfo//${{ matrix.sdk }}" -c '
            set -eu
            ext=$(echo /usr/lib/*/GL/${{ steps.manifest.outputs.gl_name }})
            test "$(cat "$ext/OpenCL/vendors/${{ steps.manifest.outputs.icd_file }}")" = "${{ steps.manifest.outputs.icd_library }}"
            for lib in "$ext"/lib/*.so*; do
              if ldd "$lib" 2>/dev/null | grep -q "not found"; then
                echo "$lib has unresolved libraries:"
                ldd "$lib" 2>/dev/null | grep "not found"
                exit 1
              fi
            done
            echo "the ICD points at the driver and every library resolves"
          '

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.series }}-${{ matrix.version }}-${{ matrix.sdk }}
          path: build/bundles/
          if-no-files-found: error

  publish:
    needs: [detect, build]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: bundles

      - name: Publish the bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/publish-releases.py --repo "$GITHUB_REPOSITORY" --artifacts bundles \
            --main "${{ needs.detect.outputs.main }}" \
            --legacy "${{ needs.detect.outputs.legacy }}"

      - name: Prune old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prune-releases.py --repo "$GITHUB_REPOSITORY" --keep "$KEEP_RELEASES"
