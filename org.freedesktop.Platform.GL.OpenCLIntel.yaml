id: org.freedesktop.Platform.GL.OpenCLIntel
branch: '26.08'
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
build-extension: true
separate-locales: false

modules:
  - name: compute-runtime
    buildsystem: simple
    build-commands:
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo
      - ar p intel-ocloc-dbgsym.ddeb data.tar.zst | tar --zstd -x --strip-components=2 -C ${FLATPAK_DEST}
      - ar p intel-ocloc.deb data.tar.zst | tar --zstd -x --strip-components=2 -C ${FLATPAK_DEST}
      - ar p intel-opencl-icd-dbgsym.ddeb data.tar.zst | tar --zstd -x --strip-components=2 -C ${FLATPAK_DEST}
      - ar p intel-opencl-icd.deb data.tar.zst | tar --zstd -x --strip-components=2 -C ${FLATPAK_DEST}
      - ar p libigdgmm12.deb data.tar.zst | tar --zstd -x --strip-components=2 -C ${FLATPAK_DEST}
      - ar p libze-intel-gpu1-dbgsym.ddeb data.tar.zst | tar --zstd -x --strip-components=2 -C ${FLATPAK_DEST}
      - ar p libze-intel-gpu1.deb data.tar.zst | tar --zstd -x --strip-components=2 -C ${FLATPAK_DEST}
      - ar p intel-igc-core-2.deb data.tar.zst | tar --zstd -x --strip-components=3 -C ${FLATPAK_DEST}
      - ar p intel-igc-opencl-2.deb data.tar.zst | tar --zstd -x --strip-components=3 -C ${FLATPAK_DEST}
      - mv -- ${FLATPAK_DEST}/lib/x86_64-linux-gnu/* ${FLATPAK_DEST}/lib
      - mv -- ${FLATPAK_DEST}/lib/intel-opencl/* ${FLATPAK_DEST}/lib
      - echo libigdrcl.so > ${FLATPAK_DEST}/OpenCL/vendors/intel.icd
      - ldconfig -n lib

    sources:
      - type: file
        url: https://github.com/intel/compute-runtime/releases/download/26.35.39758.10/intel-ocloc-dbgsym_26.35.39758.10-0_amd64.ddeb
